{{- if .Values.extraSecretEnvs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nocodb.fullname" . }}
  labels:
    {{- include "nocodb.labels" . | nindent 4 }}
data:
  NC_DB: {{ include "databaseUri" . | b64enc}}
{{- range $key, $value := .Values.extraSecretEnvs }}
{{- if kindIs "map" $value }}
  {{ $key }}: {{ (lookup "v1" "Secret" $.Release.Namespace $value.secretName).data[$value.key] }}
{{- else }}
  {{ $key }}: '{{ $value | b64enc }}'
{{- end }}
{{- end }}
{{- end }}
